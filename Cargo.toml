[package]
name = "omaddons"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
description = "World of Warcraft addon manager for Linux: every client, one journaled transaction engine, a machine-readable CLI"
publish = false
# Every suite under tests/ is a module of the one `integration` test binary below, not a
# binary of its own: each binary links the whole library, so ~130 of them wrote ~16 GB to
# the disk for a one-line change.
autotests = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "omaddons"
path = "src/main.rs"

[[test]]
name = "integration"
path = "tests/main.rs"

[features]
# The JSON Schema generator (omad-ho1p): every test build turns it on (the dev-dependency
# on this package below), and the release binary leaves it off.
schemas = ["schemars/real"]

[dependencies]
clap = { version = "4.6.7", features = ["derive", "env", "wrap_help"] }
# omaddons completions (M4-D16): static scripts generated from the clap tree; default
# features (none) only, never unstable-dynamic.
clap_complete = "4.6.11"
flate2 = { version = "1.1.10", default-features = false, features = ["zlib-rs"] }
jiff ={ version = "0.2.38", features = ["serde"] }
md-5 = "0.11"
# TOC line ends (omad-btel): a QuestieDB TOC is 13 to 57 MB of lines. Already built in
# through serde_json and zip.
memchr = "2.8.3"
pelite = "0.10.0"
reflink-copy = "0.1.30"
rustix = { version = "1.1.5", features = ["fs", "process", "termios"] }
# schemars through a facade under its own name (omad-ho1p): with the `schemas` feature
# schemars itself, and without it (the release binary) a `JsonSchema` every type has and a
# derive that emits nothing. The binary prints schemas it embedded, never generates one.
schemars = { package = "omaddons-schema-facade", version = "0.1.0", path = "crates/schema-facade" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
shell-words = "1.1.1"
tar = { version = "0.4.46", default-features = false }
tempfile = "3.27.0"
thiserror = "2.0.21"
toml = "1.1.8"
toml_edit = "0.25.17"
ulid = { version = "3.0.0", features = ["serde"] }
ureq = { version = "3.4.2", default-features = false, features = ["rustls"] }
zip = { version = "9.0.3", default-features = false, features = ["deflate-flate2-zlib-rs"] }
zstd = { version = "0.14.3", default-features = false }

# build.rs: the widget assets' digest, which `status` compares on every call (E4).
[build-dependencies]
sha2 = "0.11.1"

[dev-dependencies]
assert_cmd = "2.2.2"
# The XDG oracle for src/state/paths.rs, which mirrors its rules but never falls back
# to the passwd entry when HOME is unset.
etcetera = "0.11.0"
insta ={ version = "1.49.0", features = ["json"] }
# The contract suite's JSON Schema validator (M4-D9): default features off, so no
# reqwest or TLS backend (deny.toml); pinned so a release cannot change what passes.
jsonschema = { version = "=0.60.2", default-features = false }
# This package with `schemas` (omad-ho1p): tests, the library they test and the binary
# they run all generate schemas. Normal builds never see a dev-dependency's features.
omaddons = { version = "0.1.0", path = ".", features = ["schemas"] }
predicates = "3.1.4"
proptest = "1.12.0"
# tests/terminal.rs: a pseudo-terminal for the binary's stderr, so human progress draws
# as it does on a terminal. Test builds only: the binary opens none.
rustix = { version = "1.1.5", features = ["pty"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"

# Debug and test builds keep line tables (file:line in panics and backtraces) but no full
# DWARF, and dependencies none: full debuginfo was most of every test binary's size. For a
# debugger session: CARGO_PROFILE_DEV_DEBUG=true.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

# Built for size (omad-ylko): opt-level "s" with fat LTO is 17.7 MB, against 24.9 MB at
# opt-level 3 with thin LTO, and keeps every tests/perf.rs budget and argc bench target
# (status --cached +1%, capabilities +16%). "z" is 16.1 MB but misses status --cached's
# 5 ms budget (+20%) and puts the large-TOC and 64 MiB parse budgets at their edge.
[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
strip = true

# `argc bench` only: an optimised binary that still replays HTTP fixtures (debug
# assertions on), for the cold runs that need the network to be repeatable.
[profile.bench-fixtures]
inherits = "release"
debug-assertions = true
