# The built-in addon catalog (vision §5.4), embedded in the binary.
#
# Every value here was verified, not remembered (2026-10-14; BugSack, ElvUI and Tukui
# 2026-10-16; TellMeWhen through BattlePetBreedID, and the WoWInterface entries,
# 2026-10-20):
# - the GitHub release.json publishers: the repository's releases/latest tag, its
#   release.json, and the addon roots of the actual release zip;
# - the Tukui entries: the API's list (api.tukui.org/v1/addons), then the zip that
#   /v1/addon/<slug> hands out, downloaded at once: its top-level folders and each TOC's
#   "## Interface" (the list's patch[] lags the TOCs);
# - the WoWInterface entries: the API's filedetails (the project's current file and its
#   MD5), then that file, downloaded and MD5-checked: its top-level folders and the
#   families its TOCs load on (the site's compatibility tags lag the TOCs);
# - the legacy entries: the TOC's "## Interface" line in the repository;
# - BugGrabber (2026-10-22): WowAce's PROPFIND of tags/ (the newest stable tag and its
#   revision), then each tree fetched at its pinned revision and assembled within the
#   packaging subset: the newest tag's TOC Interface list gives the modern families;
#   trunk's TOC at each revision gives the legacy ones (r130 is the last 2.4.3 revision,
#   r152 the 3.3.5a one), and the 1.12-era tree outside trunk (tmp/trunk/!BugGrabber) the
#   1.12.1 one (r43, the last declaring 11200; 2026-10-22). Every 4.3.4 and 5.4.8
#   revision needs the packager (@localization keywords filled in from CurseForge's
#   localization service), so those two families have no variant: no keyless build
#   exists, unless a CurseForge source (M5) offers packaged files for those eras.
# `summary` is the one sentence a player reads in `search` and the bar widget: what the
# addon does, from its publisher's own words (2026-11-09: the GitHub repository's
# description, else its main TOC's "## Notes", its README or its localized notes; the
# WoWInterface API's description; the Tukui API's small_desc; BugGrabber's TOC Notes).
# `notes` are the maintainer's record of how an entry was verified, never shown as what
# the addon is.
# `families` lists where an entry is known to work (from release.json flavors, or the
# TOCs' Interface); TOC verification still decides every install. A name with several
# entries gives each a `variant` and pairwise disjoint `families`: a client gets the one
# declaring its family, or none.
#
# Override or extend it in <config>/omaddons/catalog.d/*.toml (same format; an entry
# naming a `variant` replaces only that one, one naming only the name replaces every
# variant; `remove = true` drops a built-in entry by name, or one variant).

schema_version = "1.0"

