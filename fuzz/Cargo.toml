# The cargo-fuzz crate (vision §5.12): one target per parser of bytes omaddons does not
# control. Its own workspace, so the main package's build, clippy and tests never compile
# it. Run through `argc fuzz <target>` (needs cargo-fuzz and a nightly toolchain).
[package]
name = "omaddons-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[workspace]
members = ["."]

[dependencies]
libfuzzer-sys = "0.4"
omaddons = { path = ".." }

[[bin]]
name = "bpsv"
path = "fuzz_targets/bpsv.rs"
test = false
doc = false
bench = false

[[bin]]
name = "product_db"
path = "fuzz_targets/product_db.rs"
