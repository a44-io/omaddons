# The TOC load-rule matrix (M1 checkpoint 3), one row per case x client.
#
# Every TOC here is a minimal synthetic file written for this repository. The addon
# folder is `Foo` unless `folder` says otherwise; `files` are (name, contents).
#
# target: { product = "<Battle.net product code>" } builds the client from a synthetic
# Battle.net tree, as discovery does; { version = "x.y.z", kind = "battlenet"|"custom" }
# takes the family, rules row and interface straight from the builtin tables.
#
# Client interfaces (from the rules tables): retail 12.1.5 120105, 12.1.0 120100,
# 10.2.6 100206, Mists Classic 5.5.4 50504, Classic Era 1.15.9 11509, Anniversary/TBC
# 2.5.6 20506, Wrath 3.4.3 30403, Titan 3.80.2 38002, Cata 4.4.2 40402, Forever 1.60.1
# 16001; legacy 1.12.1 11200, 2.4.3 20400, 3.3.5a 30300, 4.3.4 40300, 5.4.8 50400; a
# custom 1.16-1.49 build of the 1.12 client (Turtle WoW 1.18.1) pinned at 11200; an
# unmapped Battle.net 2.6.0 is family unknown at 20600.
#
# The suffix sweep (group 1) is generated by tests/toc_matrix.rs.

# ---- 2. Forever guard ------------------------------------------------------------------

